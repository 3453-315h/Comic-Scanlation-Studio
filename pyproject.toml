[project]
name = "scanlation-tool"
version = "1.0.0"
description = "Comic Translation Studio - Automatic manga/comic translation tool"
requires-python = ">=3.10"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
check_untyped_defs = true
exclude = [
    "venv",
    "tests",
    "__pycache__",
    "build",
    "dist"
]

# Per-module options for stricter checking on core modules
[[tool.mypy.overrides]]
module = [
    "src.core.*",
    "src.modules.*"
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # Line too long (we have line-length instead)
